# Once a week, regenerates the highlighting from the lexer on EasyCrypt's main
# branch and, if the keywords changed, opens a pull request with the result.
# It can also be started by hand from the Actions tab.

name: Grammar

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the branch
      pull-requests: write # to open the pull request
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate from EasyCrypt's lexer
        run: |
          sha=$(gh api repos/EasyCrypt/easycrypt/commits/main --jq .sha)
          curl -fsSL "https://raw.githubusercontent.com/EasyCrypt/easycrypt/$sha/src/ecLexer.mll" -o "$RUNNER_TEMP/ecLexer.mll"
          node scripts/gen-grammar.mjs "$RUNNER_TEMP/ecLexer.mll"
          echo "EASYCRYPT_SHA=$sha" >> "$GITHUB_ENV"
      - name: Look for changes
        id: changes
        run: |
          if git diff --quiet syntaxes/; then
            echo "The highlighting is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pull requests opened from a workflow do not start the Tests workflow.
      - name: Test the new grammar
        if: steps.changes.outputs.changed
        run: npm ci && npm test
      - name: Open a pull request
        if: steps.changes.outputs.changed
        run: |
          git config user.name "Mehdi"
          git config user.email "26183528+mehdigolpayegani@users.noreply.github.com"
          git switch -C update-grammar
          git commit -am "Update highlighting from EasyCrypt's lexer"
          git push --force origin update-grammar
          # If a pull request is still open, the push above has updated it.
          if [ -z "$(gh pr list --head update-grammar --state open --json number --jq '.[].number')" ]; then
            gh pr create --head update-grammar --title "Update highlighting from EasyCrypt's lexer" \
              --body "Regenerated from [ecLexer.mll](https://github.com/EasyCrypt/easycrypt/blob/$EASYCRYPT_SHA/src/ecLexer.mll) at EasyCrypt commit $EASYCRYPT_SHA."
          fi
