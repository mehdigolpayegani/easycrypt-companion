# Runs the tests on every push to main and on pull requests. Tests that need
# EasyCrypt skip themselves here, since it is not installed.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the package
        run: npm run package
