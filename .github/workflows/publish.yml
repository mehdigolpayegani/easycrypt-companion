# Publishes the extension when a version tag such as v0.1.0 is pushed: to
# Open VSX, with the token in the repository secret OVSX_PAT, and as a GitHub
# release with the package attached, to upload to the Marketplace by hand.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that the tag is the version in package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version in package.json ($version)."
            exit 1
          fi
      - name: Build the package
        run: npm run package
      # --skip-duplicate: running the job again does not fail where it already worked.
      - name: Publish to Open VSX
        run: npx ovsx publish --packagePath "easycrypt-companion-${GITHUB_REF_NAME#v}.vsix" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create the GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes are the version's section of the changelog.
          awk -v heading="## $version" '$0 == heading { keep = 1; next } /^## / { keep = 0 } keep' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "easycrypt-companion-$version.vsix" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
